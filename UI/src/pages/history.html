<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/js/theme-init.js"></script>
  <script src="/js/lang-init.js"></script>

  <title>Trade History - Broker App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body data-title-i18n="titles.history">
  <header class="top-nav header-centered">
    <div class="header-leading">
      <a href="dashboard.html" class="brand-logo-link" aria-label="Broker App">
        <img src="/images/LOGO.png?v=6" alt="" width="160" height="40" decoding="async">
      </a>
      <a href="dashboard.html" class="btn btn-outline header-back" data-i18n-aria-label="common.back">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
        <span data-i18n="common.back">Back</span>
      </a>
    </div>
    <h2 class="header-page-title" data-i18n="history.title">Closed Trades History</h2>
  </header>

  <div class="container mt-20">
    <div class="card flex-gap text-left align-items-center" style="align-items: center; justify-content: flex-start; padding: 15px;">
      <div class="form-group mb-0" style="margin-bottom:0;"><label style="margin:0 0 5px 0;" data-i18n="common.from">From:</label><input type="date" class="form-control" style="padding: 8px;"></div>
      <div class="form-group mb-0" style="margin-bottom:0;"><label style="margin:0 0 5px 0;" data-i18n="common.to">To:</label><input type="date" class="form-control" style="padding: 8px;"></div>
      <div class="form-group mb-0" style="margin-bottom:0;"><label style="margin:0 0 5px 0;" data-i18n="common.symbol">Symbol:</label><input type="text" class="form-control" data-i18n-placeholder="history.placeholderSymbol" placeholder="e.g. EURUSD" style="padding: 8px;"></div>
      <div class="flex-gap" style="margin-top: 25px;">
        <button type="button" class="btn btn-primary" style="padding: 10px 25px;" data-i18n="common.filter">Filter</button>
        <button type="button" class="btn btn-outline-dark" style="padding: 10px 25px;" data-i18n="history.export">Export to CSV / PDF</button>
      </div>
    </div>

    <div class="stats-grid mb-20" style="margin-bottom:30px;">
      <div class="card stat-card mb-0">
        <div class="label text-secondary text-sm" data-i18n="history.totalTrades">Total Closed Trades</div>
        <div class="value font-bold text-primary text-xl" id="historyTotalTrades">0</div>
      </div>
      <div class="card stat-card mb-0">
        <div class="label text-secondary text-sm" data-i18n="history.netPl">Net P/L</div>
        <div class="value text-success font-bold text-xl" id="historyNetPl">+$0.00</div>
      </div>
      <div class="card stat-card mb-0">
        <div class="label text-secondary text-sm" data-i18n="history.winRate">Win Rate</div>
        <div class="value text-primary font-bold text-xl" id="historyWinRate">0.0%</div>
      </div>
      <div class="card stat-card mb-0">
        <div class="label text-secondary text-sm" data-i18n="history.totalVol">Total Volume (Lots)</div>
        <div class="value text-primary font-bold text-xl" id="historyTotalVol">0.0</div>
      </div>
    </div>

    <div class="card text-left">
      <h3 class="mb-20 text-xl font-bold border-bottom" style="padding-bottom:10px; border-bottom: 2px solid var(--border-light)" data-i18n="history.closedOrders">Closed Orders</h3>
      <table class="mt-20">
        <thead>
          <tr>
            <th data-i18n="history.ticket">Ticket ID</th>
            <th data-i18n="history.openTime">Open Time</th>
            <th data-i18n="history.closeTime">Close Time</th>
            <th data-i18n="table.symbol">Symbol</th>
            <th data-i18n="history.direction">Direction</th>
            <th data-i18n="history.lots">Lots</th>
            <th data-i18n="table.openPrice">Open Price</th>
            <th data-i18n="history.closePrice">Close Price</th>
            <th data-i18n="history.plUsd">P/L ($)</th>
          </tr>
        </thead>
        <tbody id="historyRows"></tbody>
      </table>
    </div>
  </div>
  
  <script type="module" src="/js/pages/history.js"></script>
</body>
</html>
