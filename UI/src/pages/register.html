<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/js/theme-init.js"></script>
  <script src="/js/lang-init.js"></script>

  <title>Register - Broker App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body data-title-i18n="titles.register">
  <header class="top-nav">
    <a href="landing.html" class="brand-logo-link" aria-label="Broker App">
      <img src="/images/LOGO.png?v=6" alt="" width="160" height="40" decoding="async">
    </a>
    <a href="login.html" class="btn btn-outline" data-i18n="landing.logIn">Log In</a>
  </header>
  
  <div class="container" style="max-width: 600px; margin-top: 30px;">
    <div class="card">
      <h2 class="text-center" data-i18n="register.heading">Sign Up</h2>
      <p class="text-center" style="color: var(--text-secondary); margin-bottom: 20px;" data-i18n="register.sub">Create a new trading account</p>
      
      <form id="registerForm" class="text-left">
        <div class="grid-2">
          <div class="form-group">
            <label data-i18n="register.firstName">First Name</label>
            <input type="text" id="regFirstName" class="form-control" placeholder="" autocomplete="given-name">
          </div>
          <div class="form-group">
            <label data-i18n="register.lastName">Last Name</label>
            <input type="text" id="regLastName" class="form-control" placeholder="" autocomplete="family-name">
          </div>
        </div>
        
        <div class="form-group">
          <label data-i18n="register.idDoc">ID / Passport Number</label>
          <input type="text" id="regIdDoc" class="form-control" placeholder="" autocomplete="off">
        </div>
        
        <div class="form-group">
          <label data-i18n="login.email">Email Address</label>
          <input type="email" id="regEmail" class="form-control" data-i18n-placeholder="login.emailPlaceholder" placeholder="email@domain.com" autocomplete="email">
        </div>
        
        <div class="form-group">
          <label data-i18n="register.phone">Phone Number</label>
          <input type="tel" id="regPhone" class="form-control" placeholder="" autocomplete="tel">
        </div>
        
        <div class="form-group">
          <label data-i18n="login.password">Password</label>
          <input type="password" id="regPassword" class="form-control" placeholder="••••••••" autocomplete="new-password">
        </div>
        
        <div class="grid-2">
          <div class="form-group">
            <label data-i18n="register.currency">Account Currency</label>
            <select id="regCurrency" class="form-control"><option>USD</option><option>EUR</option><option>GBP</option></select>
          </div>
          <div class="form-group">
            <label data-i18n="register.leverage">Preferred Leverage</label>
            <select id="regLeverage" class="form-control"><option>1:100</option><option>1:50</option><option>1:500</option></select>
          </div>
        </div>
        
        <div class="form-group flex-gap">
          <input type="checkbox" id="terms">
          <label for="terms" style="margin:0;" data-i18n="register.terms">I accept the Terms of Service and Privacy Policy</label>
        </div>
        
        <div class="form-group flex-gap">
          <input type="checkbox" id="risk">
          <label for="risk" style="margin:0;" data-i18n="register.risk">I understand the risks involved in financial trading</label>
        </div>
        
        <button type="button" id="registerBtn" class="btn btn-primary" style="width: 100%; margin-top: 10px;" data-i18n="register.submit">Create Account</button>
      </form>
    </div>
  </div>
  
  <script type="module" src="/js/pages/register.js"></script>
</body>
</html>
