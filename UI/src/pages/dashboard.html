<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/js/theme-init.js"></script>
  <script src="/js/lang-init.js"></script>

  <title>Dashboard - Broker App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/main.css">
</head>

<body data-title-i18n="titles.dashboard">
  <header class="top-nav">
    <a href="dashboard.html" class="brand-logo-link" aria-label="Broker App">
      <img src="/images/LOGO.png?v=6" alt="" width="160" height="40" decoding="async">
    </a>
    <div class="nav-links" style="display:flex; align-items:center; gap:18px; flex: 1;">
      <a href="positions.html" data-i18n="nav.positions">Positions</a>
      <a href="charts.html" data-i18n="nav.charts">Charts</a>
      <a href="finance.html" data-i18n="nav.finance">Finance</a>
      <a href="history.html" data-i18n="nav.history">History</a>
      <a href="account.html" data-i18n="nav.account">Account</a>
      <a href="settings.html" data-i18n="nav.settings">Settings</a>
    </div>
    <div class="flex-gap" style="margin-left:auto;">
      <button type="button" class="btn btn-primary" id="dashboardLogoutBtn" style="padding:8px 14px;" data-i18n="account.logout">Log out</button>
    </div>
  </header>

  <div class="container mt-20">
    <div class="stats-grid mb-20">
      <div class="card stat-card">
        <div class="label" style="color: var(--text-secondary)" data-i18n="dashboard.balance">Balance</div>
        <div class="value" id="dashboardBalance">$0.00</div>
      </div>
      <div class="card stat-card">
        <div class="label" style="color: var(--text-secondary)" data-i18n="dashboard.equity">Equity</div>
        <div class="value" id="dashboardEquity">$0.00</div>
      </div>
      <div class="card stat-card">
        <div class="label" style="color: var(--text-secondary)" data-i18n="dashboard.pl">P/L</div>
        <div class="value text-success" id="dashboardPl">+$0.00</div>
      </div>
    </div>

    <div class="grid-2 mb-20" style="grid-template-columns: 2fr 1fr;">
      <div class="card flex"
        style="align-items:center; justify-content:center; background: var(--bg-alt); min-height: 250px;">
        <span class="text-muted" data-i18n="dashboard.chartArea">Portfolio Performance Chart Area</span>
      </div>
      <div class="card" style="background: transparent; box-shadow:none;">
        <h3 data-i18n="dashboard.alerts">Alerts</h3>
        <ul id="dashboardAlertsList" style="list-style: none; padding: 0;"></ul>
      </div>
    </div>

    <div class="flex-between mb-20">
      <h3 data-i18n="dashboard.openPositions">Open Positions</h3>
      <div class="flex-gap">
        <a href="charts.html" class="btn btn-primary" data-i18n="dashboard.newTrade">New Trade</a>
        <a href="charts.html" class="btn btn-outline-dark" data-i18n="dashboard.viewCharts">View Charts</a>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th data-i18n="table.symbol">Symbol</th>
          <th data-i18n="table.volume">Volume</th>
          <th data-i18n="table.openPrice">Open Price</th>
          <th data-i18n="table.currentPrice">Current Price</th>
          <th data-i18n="table.pl">P/L</th>
          <th data-i18n="table.status">Status</th>
        </tr>
      </thead>
      <tbody id="dashboardPositionsBody"></tbody>
    </table>
  </div>

  <script type="module" src="/js/pages/dashboard.js"></script>
</body>

</html>
