<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/js/theme-init.js"></script>
  <script src="/js/lang-init.js"></script>

  <title>Account - Broker App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/main.css">
</head>

<body data-title-i18n="titles.account">
  <header class="top-nav header-centered">
    <div class="header-leading">
      <a href="dashboard.html" class="brand-logo-link" aria-label="Broker App">
        <img src="/images/LOGO.png?v=6" alt="" width="160" height="40" decoding="async">
      </a>
      <a href="dashboard.html" class="btn btn-outline header-back" data-i18n-aria-label="common.back">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
        <span data-i18n="common.back">Back</span>
      </a>
    </div>
    <h2 class="header-page-title" data-i18n="account.title">User Account</h2>
  </header>

  <div class="container mt-20" style="max-width: 600px;">
    <div class="card text-center" style="position: relative; overflow: hidden;">
      <div
        style="width: 90px; height: 90px; border-radius: 50%; background: #3c328f; color: white; display:flex; align-items:center; justify-content:center; font-size: 2.2rem; margin: 30px auto 15px; position: relative; border: 4px solid var(--bg); font-weight: bold;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="white">
          <path
            d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
        </svg>
      </div>
      <p class="text-secondary text-sm mb-5" data-i18n="account.clientName">Client Name</p>
      <h2 class="font-bold" id="accountDisplayName">—</h2>
      <p class="text-secondary text-sm" id="accountUidLine" data-i18n="account.uid">UID: ---</p>
    </div>

    <div class="card text-left">
      <h3 class="mb-20 text-xl border-bottom" style="padding-bottom:10px; border-bottom: 2px solid var(--border-light)" data-i18n="account.personal">
        Personal Information</h3>
      <ul style="list-style:none; padding:0;">
        <li class="flex-between" style="padding:15px 0; border-bottom: 1px solid var(--border-light)">
          <span class="font-bold" data-i18n="account.idPassport">ID / Passport</span><span class="text-secondary" id="accountValIdDoc">—</span>
        </li>
        <li class="flex-between" style="padding:15px 0; border-bottom: 1px solid var(--border-light)">
          <span class="font-bold" data-i18n="account.email">Email</span><span class="text-secondary dir-ltr" id="accountValEmail">—</span>
        </li>
        <li class="flex-between" style="padding:15px 0; border-bottom: 1px solid var(--border-light)">
          <span class="font-bold" data-i18n="account.phone">Phone</span><span class="text-secondary dir-ltr" id="accountValPhone">—</span>
        </li>
        <li class="flex-between" style="padding:15px 0">
          <span class="font-bold" data-i18n="account.pan">Account PAN</span><span class="text-secondary dir-ltr" id="accountValPan">—</span>
        </li>
      </ul>
    </div>

    <div class="flex-gap flex-col" style="width:100%;">
      <button type="button" class="btn btn-primary" id="editProfileBtn" style="width:100%; padding: 15px; font-size: 1.1rem;" data-i18n="account.edit">Edit Profile</button>
      <button type="button" class="btn btn-outline-dark" id="accountLogoutBtn" style="width:100%; padding: 15px; font-size: 1.1rem;" data-i18n="account.logout">Log out</button>
    </div>
  </div>

  <script type="module" src="/js/pages/account.js"></script>
</body>

</html>
