<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/js/theme-init.js"></script>
  <script src="/js/lang-init.js"></script>

  <title>Positions - Broker App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body data-title-i18n="titles.positions">
  <header class="top-nav header-centered">
    <div class="header-leading">
      <a href="dashboard.html" class="brand-logo-link" aria-label="Broker App">
        <img src="/images/LOGO.png?v=6" alt="" width="160" height="40" decoding="async">
      </a>
      <a href="dashboard.html" class="btn btn-outline header-back" data-i18n-aria-label="common.back">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
        <span data-i18n="common.back">Back</span>
      </a>
    </div>
    <h2 class="header-page-title" data-i18n="positions.title">Manage Positions</h2>
  </header>

  <div class="container mt-20">
    <div class="card flex-between" style="padding: 15px 20px;">
      <div class="flex-gap">
        <button type="button" class="btn btn-primary" data-i18n="positions.open">Open</button>
        <button type="button" class="btn btn-outline-dark" data-i18n="positions.closed">Closed</button>
        <button type="button" class="btn btn-outline-dark" data-i18n="positions.pending">Pending</button>
      </div>
      <div>
        <input type="text" class="form-control" data-i18n-placeholder="common.search" placeholder="Search..." style="padding: 8px;">
      </div>
    </div>
    
    <table>
      <thead>
        <tr>
          <th data-i18n="table.symbol">Symbol</th>
          <th data-i18n="table.type">Type</th>
          <th data-i18n="table.volume">Volume</th>
          <th data-i18n="table.openPrice">Open Price</th>
          <th data-i18n="table.currentPrice">Current Price</th>
          <th data-i18n="table.slTp">SL / TP</th>
          <th data-i18n="table.action">Action</th>
        </tr>
      </thead>
      <tbody id="positionsData">
        <tr>
          <td><strong class="font-bold">EURUSD</strong></td>
          <td><span class="badge badge-success" data-i18n="badge.buy">BUY</span></td>
          <td>1.00</td>
          <td>1.0845</td>
          <td class="text-success font-bold">1.0892</td>
          <td style="font-size: 0.8rem; color: var(--text-muted)">SL: 1.0800<br>TP: 1.0950</td>
          <td><button type="button" class="btn btn-danger close-position" data-symbol="EURUSD" style="padding: 6px 12px; font-size: 0.8rem;" data-i18n="common.close">Close</button></td>
        </tr>
        <tr>
          <td><strong class="font-bold">BTCUSD</strong></td>
          <td><span class="badge badge-danger" data-i18n="badge.sell">SELL</span></td>
          <td>0.50</td>
          <td>67,240</td>
          <td class="text-danger font-bold">66,980</td>
          <td style="font-size: 0.8rem; color: var(--text-muted)">SL: 68,000<br>TP: 66,500</td>
          <td><button type="button" class="btn btn-danger close-position" data-symbol="BTCUSD" style="padding: 6px 12px; font-size: 0.8rem;" data-i18n="common.close">Close</button></td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <script type="module" src="/js/pages/positions.js"></script>
</body>
</html>
