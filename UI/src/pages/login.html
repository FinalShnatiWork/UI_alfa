<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/js/theme-init.js"></script>
  <script src="/js/lang-init.js"></script>

  <title>Login - Broker App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body data-title-i18n="titles.login">
  <header class="top-nav">
    <a href="landing.html" class="brand-logo-link" aria-label="Broker App">
      <img src="/images/LOGO.png?v=6" alt="" width="160" height="40" decoding="async">
    </a>
    <a href="register.html" class="btn btn-outline" data-i18n="landing.signUp">Sign Up</a>
  </header>
  
  <div class="container" style="max-width: 450px; margin-top: 50px;">
    <div class="card text-center">
      <h2 data-i18n="login.heading">Log In</h2>
      <p style="color: var(--text-secondary); margin-bottom: 20px;" data-i18n="login.sub">Access your trading account</p>
      
      <form id="loginForm" class="text-left">
        <div class="form-group">
          <label data-i18n="login.email">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" autocomplete="email" data-i18n-placeholder="login.emailPlaceholder" placeholder="email@domain.com">
        </div>
        <div class="form-group">
          <label data-i18n="login.password">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" autocomplete="current-password">
        </div>
        
        <div class="flex-between mb-20">
          <a href="#" id="forgotPasswordLink" style="color: var(--blue); font-size: 0.85rem; text-decoration: none;" data-i18n="login.forgot">Forgot Password?</a>
        </div>
        
        <button type="button" id="loginBtn" class="btn btn-primary" style="width: 100%; margin-bottom: 20px;" data-i18n="login.submit">Log In</button>
        
        <div style="border-top: 1px solid var(--border-light); margin: 20px 0; position: relative; text-align: center;">
          <span style="background: var(--bg); padding: 0 10px; color: var(--text-muted); font-size: 0.8rem; position: relative; top: -10px;" data-i18n="common.or">OR</span>
        </div>
        
        <button type="button" id="googleLoginBtn" class="btn btn-outline-dark" style="width: 100%;" data-i18n="login.google">
          Continue with Google
        </button>
      </form>
    </div>
  </div>
  
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
