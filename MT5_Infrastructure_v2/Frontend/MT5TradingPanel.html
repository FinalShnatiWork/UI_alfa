<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT5 Bridge Trading Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .panel { background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 350px; }
        h2 { margin-top: 0; font-weight: 300; border-bottom: 1px solid #334155; padding-bottom: 1rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #94a3b8; }
        input, select { width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        .btn-row { display: flex; gap: 1rem; }
        button { flex: 1; padding: 0.75rem; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        .btn-buy { background: #22c55e; color: white; }
        .btn-sell { background: #ef4444; color: white; }
        button:hover { opacity: 0.8; }
        #status { margin-top: 1rem; font-size: 0.8rem; color: #38bdf8; text-align: center; }
    </style>
</head>
<body>
    <div class="panel">
        <h2>MT5 Execution</h2>
        <div class="form-group">
            <label>Symbol</label>
            <input type="text" id="symbol" value="EURUSD">
        </div>
        <div class="form-group">
            <label>Lot Size</label>
            <input type="number" id="lot" value="0.01" step="0.01">
        </div>
        <div class="btn-row">
            <button class="btn-buy" onclick="sendOrder('BUY')">BUY</button>
            <button class="btn-sell" onclick="sendOrder('SELL')">SELL</button>
        </div>
        <div id="status">Ready</div>
    </div>

    <script>
        async function sendOrder(action) {
            const symbol = document.getElementById('symbol').value;
            const lot = document.getElementById('lot').value;
            const status = document.getElementById('status');
            
            status.textContent = "Sending order to MT5...";
            
            try {
                const response = await fetch('/api/mt5-bridge/trade', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbol, action, lot })
                });
                
                const result = await response.json();
                if (response.ok) {
                    status.textContent = "SUCCESS: " + (result.message || "Order Executed");
                    status.style.color = "#22c55e";
                } else {
                    status.textContent = "ERROR: " + (result.error || "Execution Failed");
                    status.style.color = "#ef4444";
                }
            } catch (err) {
                status.textContent = "ERROR: Bridge Offline";
                status.style.color = "#ef4444";
            }
        }
    </script>
</body>
</html>
