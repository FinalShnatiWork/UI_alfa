<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Broker App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <header class="top-nav">
    <div class="logo font-bold text-xl">LOGO</div>
    <a href="register.html" class="btn btn-outline">Sign Up</a>
  </header>
  
  <div class="container" style="max-width: 450px; margin-top: 50px;">
    <div class="card text-center">
      <h2>Log In</h2>
      <p style="color: var(--text-secondary); margin-bottom: 20px;">Access your trading account</p>
      
      <form id="loginForm" class="text-left">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" class="form-control" autocomplete="off" placeholder="email@domain.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" placeholder="••••••••">
        </div>
        
        <div class="flex-between mb-20">
          <a href="#" style="color: var(--blue); font-size: 0.85rem; text-decoration: none;">Forgot Password?</a>
        </div>
        
        <button type="button" id="loginBtn" class="btn btn-primary" style="width: 100%; margin-bottom: 20px;">Log In</button>
        
        <div style="border-top: 1px solid var(--border-light); margin: 20px 0; position: relative; text-align: center;">
          <span style="background: var(--bg); padding: 0 10px; color: var(--text-muted); font-size: 0.8rem; position: relative; top: -10px;">OR</span>
        </div>
        
        <button type="button" class="btn btn-outline-dark" style="width: 100%;">
          Continue with Google
        </button>
      </form>
    </div>
  </div>
  
  <script type="module" src="/js/login.js"></script>
</body>
</html>
