<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charts - Broker App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <header class="top-nav">
    <div class="flex-gap">
      <a href="dashboard.html" style="color:white;text-decoration:none;">← Back</a>
      <h2 style="margin:0; font-size: 1.2rem;">Charts</h2>
    </div>
  </header>
  
  <div class="container mt-20">
    <div class="flex-between mb-20">
      <div class="flex-gap">
        <button class="btn btn-blue">EURUSD</button>
        <button class="btn btn-outline-dark" style="background:#fff">BTCUSD</button>
        <button class="btn btn-outline-dark" style="background:#fff">AAPL</button>
      </div>
      <div class="flex-gap text-muted text-sm">
        <span style="cursor:pointer;">1m</span>
        <span style="cursor:pointer;">5m</span>
        <span class="text-primary font-bold" style="cursor:pointer;">1H</span>
        <span style="cursor:pointer;">4H</span>
        <span style="cursor:pointer;">1D</span>
      </div>
    </div>
    
    <div class="card" style="height: 450px; display:flex; align-items:center; justify-content:center; background: #fff; position: relative;">
      <div style="text-align:center; color: var(--text-muted);">
        <h3 style="color:var(--text-muted)">Chart View Area (Canvas / TradingView API)</h3>
        <p>Contains candlestick data and indicators like MA, RSI</p>
      </div>
    </div>
    
    <div class="card flex-between mt-20">
      <div>
        <div class="font-bold text-xl text-primary">EURUSD</div>
        <div class="text-secondary text-sm">Bid: 1.0889 | Ask: 1.0892</div>
      </div>
      <div class="flex-gap">
        <a href="trading.html" class="btn btn-primary" style="padding: 12px 35px; font-size: 1.1rem;">BUY</a>
        <a href="trading.html" class="btn btn-danger" style="padding: 12px 35px; font-size: 1.1rem;">SELL</a>
      </div>
    </div>
  </div>
  
  <script type="module" src="/js/charts.js"></script>
</body>
</html>
