<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account - Broker App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/main.css">`n  <script src="/js/prefs-init.js"></script>
</head>

<body>
  <header class="top-nav">
    <div class="flex-gap">
      <a href="dashboard.html" style="color:white;text-decoration:none;">â† Back</a>
      <h2 style="margin:0; font-size: 1.2rem;">User Account</h2>
    </div>
  </header>

  <div class="container mt-20" style="max-width: 600px;">
    <div class="card text-center" style="position: relative; overflow: hidden;">
      <div
        style="width: 90px; height: 90px; border-radius: 50%; background: #3c328f; color: white; display:flex; align-items:center; justify-content:center; font-size: 2.2rem; margin: 30px auto 15px; position: relative; border: 4px solid var(--bg); font-weight: bold;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="white">
          <path
            d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
        </svg>
      </div>
      <h2 class="font-bold">Client Name</h2>
      <p class="text-secondary text-sm">UID: ---</p>
    </div>

    <div class="card text-left">
      <h3 class="mb-20 text-xl border-bottom" style="padding-bottom:10px; border-bottom: 2px solid var(--border-light)">
        Personal Information</h3>
      <ul style="list-style:none; padding:0;">
        <li class="flex-between" style="padding:15px 0; border-bottom: 1px solid var(--border-light)">
          <span class="font-bold">ID / Passport</span><span class="text-secondary">---</span>
        </li>
        <li class="flex-between" style="padding:15px 0; border-bottom: 1px solid var(--border-light)">
          <span class="font-bold">Email</span><span class="text-secondary">---</span>
        </li>
        <li class="flex-between" style="padding:15px 0; border-bottom: 1px solid var(--border-light)">
          <span class="font-bold">Phone</span><span class="text-secondary">---</span>
        </li>
        <li class="flex-between" style="padding:15px 0">
          <span class="font-bold">Account PAN</span><span class="text-secondary dir-ltr">---</span>
        </li>
      </ul>
    </div>

    <div class="card text-left">
      <h3 class="mb-20 text-xl border-bottom" style="padding-bottom:10px; border-bottom: 2px solid var(--border-light)">
        Financial Information (FIN)</h3>
      <div class="stats-grid mb-20" style="grid-template-columns: 1fr 1fr 1fr;">
        <div class="stat-card" style="border: 1px solid var(--border-light); padding:15px; border-radius: 8px;">
          <div class="label text-secondary text-sm">Balance</div>
          <div class="value text-primary">$0.00</div>
        </div>
        <div class="stat-card" style="border: 1px solid var(--border-light); padding:15px; border-radius: 8px;">
          <div class="label text-secondary text-sm">Equity</div>
          <div class="value text-primary">$0.00</div>
        </div>
        <div class="stat-card" style="border: 1px solid var(--border-light); padding:15px; border-radius: 8px;">
          <div class="label text-secondary text-sm">Free Margin</div>
          <div class="value text-primary">$0.00</div>
        </div>
      </div>
      <div class="flex-gap mt-20">
        <div class="badge badge-success" style="padding: 6px 15px; font-size:0.9rem;">Status: Active</div>
        <div class="badge" style="background:var(--blue); padding: 6px 15px; font-size:0.9rem;">Leverage: 1:100</div>
      </div>
    </div>

    <button class="btn btn-blue" style="width:100%; padding: 15px; font-size: 1.1rem;">Edit Profile</button>
  </div>

  <script type="module" src="/js/account.js"></script>
</body>

</html>
