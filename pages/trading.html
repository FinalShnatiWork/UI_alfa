<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading - Broker App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <header class="top-nav">
    <div class="flex-gap">
      <a href="dashboard.html" style="color:white;text-decoration:none;">← Back</a>
      <h2 style="margin:0; font-size: 1.2rem;">Trading Area</h2>
    </div>
  </header>
  
  <div class="container mt-20" style="max-width: 500px;">
    <div class="card text-center">
      <h2 class="mb-20 text-xl font-bold">EURUSD</h2>
      
      <div class="flex-between mb-20" style="direction: ltr;">
        <div>
          <div class="text-danger" style="font-size: 2rem; font-weight: bold;">1.0889</div>
          <div style="font-size:0.85rem; color:var(--text-muted);">BID (Sell)</div>
        </div>
        <div>
          <div class="badge badge-warning" style="font-size: 0.9rem;">0.3 <span style="font-size: 0.7rem;">spread</span></div>
        </div>
        <div>
          <div class="text-success" style="font-size: 2rem; font-weight: bold;">1.0892</div>
          <div style="font-size:0.85rem; color:var(--text-muted);">ASK (Buy)</div>
        </div>
      </div>
      
      <div class="form-group text-left">
        <label>Order Type</label>
        <div class="flex-gap">
          <button class="btn btn-blue" style="flex:1;">Market</button>
          <button class="btn btn-outline-dark" style="flex:1;">Limit</button>
          <button class="btn btn-outline-dark" style="flex:1;">Stop</button>
        </div>
      </div>
      
      <div class="form-group text-left mt-20">
        <label>Volume (Lots) [1.0 = 100k]</label>
        <div class="flex" style="gap:10px;">
          <button class="btn btn-outline-dark" id="volMinus" style="width: 50px; font-size: 1.2rem;">-</button>
          <input type="number" id="vol" class="form-control text-center text-xl font-bold" value="1.00" step="0.1">
          <button class="btn btn-outline-dark" id="volPlus" style="width: 50px; font-size: 1.2rem;">+</button>
        </div>
      </div>

      <div class="form-group text-left">
        <label>Stop Loss</label>
        <input type="number" class="form-control" placeholder="1.0800" step="0.0001">
      </div>

      <div class="form-group text-left">
        <label>Take Profit</label>
        <input type="number" class="form-control" placeholder="1.0950" step="0.0001">
      </div>

      <div class="flex-gap mt-20" style="margin-top:30px;">
        <button class="btn btn-danger" id="sellBtn" style="flex:1; padding: 20px; font-size: 1.3rem;">SELL</button>
        <button class="btn btn-primary" id="buyBtn" style="flex:1; padding: 20px; font-size: 1.3rem;">BUY</button>
      </div>
      
      <div class="mt-20 card" style="background: var(--bg-alt); text-align: left; padding: 15px;">
        <div class="text-sm text-secondary mb-20 font-bold">Order Summary</div>
        <div class="text-sm text-secondary">Leverage: 1:100</div>
        <div class="text-sm text-secondary">Required Margin: $1,089.20</div>
        <div class="text-sm text-secondary">Pip Value: $10.00</div>
      </div>
    </div>
  </div>
  
  <script type="module" src="/js/trading.js"></script>
</body>
</html>
