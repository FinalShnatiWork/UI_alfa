<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Broker App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/main.css">`n  <script src="/js/prefs-init.js"></script>
</head>
<body>
  <header class="top-nav">
    <div class="logo font-bold text-xl">LOGO</div>
    <a href="login.html" class="btn btn-outline">Log In</a>
  </header>
  
  <div class="container" style="max-width: 600px; margin-top: 30px;">
    <div class="card">
      <h2 class="text-center">Sign Up</h2>
      <p class="text-center" style="color: var(--text-secondary); margin-bottom: 20px;">Create a new trading account</p>
      
      <form id="registerForm" class="text-left">
        <div class="grid-2">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" class="form-control" placeholder="">
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" class="form-control" placeholder="">
          </div>
        </div>
        
        <div class="form-group">
          <label>ID / Passport Number</label>
          <input type="text" class="form-control" placeholder="">
        </div>
        
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" class="form-control" placeholder="email@domain.com">
        </div>
        
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" class="form-control" placeholder="">
        </div>
        
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢">
        </div>
        
        <div class="grid-2">
          <div class="form-group">
            <label>Account Currency</label>
            <select class="form-control"><option>USD</option><option>EUR</option><option>GBP</option></select>
          </div>
          <div class="form-group">
            <label>Preferred Leverage</label>
            <select class="form-control"><option>1:100</option><option>1:50</option><option>1:500</option></select>
          </div>
        </div>
        
        <div class="form-group flex-gap">
          <input type="checkbox" id="terms">
          <label for="terms" style="margin:0;">I accept the Terms of Service and Privacy Policy</label>
        </div>
        
        <div class="form-group flex-gap">
          <input type="checkbox" id="risk">
          <label for="risk" style="margin:0;">I understand the risks involved in financial trading</label>
        </div>
        
        <button type="button" id="registerBtn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Create Account</button>
      </form>
    </div>
  </div>
  
  <script type="module" src="/js/register.js"></script>
</body>
</html>
