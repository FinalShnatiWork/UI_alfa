<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Closed Trade History - Broker App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/main.css">`n  <script src="/js/prefs-init.js"></script>
</head>
<body>
  <header class="top-nav">
    <div class="flex-gap">
      <a href="dashboard.html" style="color:white;text-decoration:none;">â† Back</a>
      <h2 style="margin:0; font-size: 1.2rem;">Closed Trade History</h2>
    </div>
    <div class="flex-gap">
      <a href="positions.html" class="btn btn-outline" style="padding: 6px 16px; font-size: 0.85rem; text-decoration: none;">Open Positions</a>
    </div>
  </header>
  
  <div class="container mt-20">
    <!-- Filters -->
    <div class="card flex-gap text-left align-items-center" style="align-items: center; justify-content: flex-start; padding: 15px; flex-wrap: wrap; gap: 12px;">
      <div class="form-group mb-0" style="margin-bottom:0;">
        <label style="margin:0 0 5px 0;">From:</label>
        <input type="date" id="filterFrom" class="form-control" style="padding: 8px;">
      </div>
      <div class="form-group mb-0" style="margin-bottom:0;">
        <label style="margin:0 0 5px 0;">To:</label>
        <input type="date" id="filterTo" class="form-control" style="padding: 8px;">
      </div>
      <div class="form-group mb-0" style="margin-bottom:0;">
        <label style="margin:0 0 5px 0;">Symbol:</label>
        <input type="text" id="filterSymbol" class="form-control" placeholder="e.g. BTCUSDT" style="padding: 8px;">
      </div>
      <div class="flex-gap" style="margin-top: 25px;">
        <button id="filterBtn" class="btn btn-blue" style="padding: 10px 25px;">Filter</button>
        <button id="clearFilterBtn" class="btn btn-outline-dark" style="padding: 10px 25px;">Clear</button>
      </div>
    </div>

    <!-- Summary Stats -->
    <div class="stats-grid mb-20" style="margin-bottom: 20px;">
      <div class="card stat-card mb-0">
        <div class="label text-secondary text-sm">Total Closed Trades</div>
        <div class="value font-bold text-primary text-xl" id="statTotal">0</div>
      </div>
      <div class="card stat-card mb-0">
        <div class="label text-secondary text-sm">Total Volume (units)</div>
        <div class="value text-primary font-bold text-xl" id="statVolume">0.0</div>
      </div>
      <div class="card stat-card mb-0">
        <div class="label text-secondary text-sm">Buy Orders</div>
        <div class="value text-success font-bold text-xl" id="statBuy">0</div>
      </div>
      <div class="card stat-card mb-0">
        <div class="label text-secondary text-sm">Sell Orders</div>
        <div class="value text-danger font-bold text-xl" id="statSell">0</div>
      </div>
    </div>

    <div class="card text-left">
      <h3 class="mb-20 text-xl font-bold" style="padding-bottom:10px; border-bottom: 2px solid var(--border-light)">Closed Orders</h3>
      <div id="loadingMsg" style="text-align: center; padding: 30px; color: var(--text-muted);">Loading history...</div>
      <div id="emptyMsg" style="display:none; text-align: center; padding: 30px; color: var(--text-muted);">No closed trades yet.</div>
      <table id="historyTable" style="display:none;" class="mt-20">
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Open Time</th>
            <th>Close Time</th>
            <th>Symbol</th>
            <th>Direction</th>
            <th>Quantity</th>
            <th>Fill Price</th>
            <th>Type</th>
          </tr>
        </thead>
        <tbody id="historyData"></tbody>
      </table>
    </div>
  </div>
  
  <script type="module" src="/js/history.js"></script>
</body>
</html>
