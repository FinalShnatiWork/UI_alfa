# Load balancer in front of two backend copies (see README, "Two backend copies behind Nginx").
# Copy "a" runs on host port 8081, copy "b" on 8082. Nginx listens on 8080, where the site and
# the Vite proxy already send /api, so nothing else has to change.

events {}

http {
  # Sessions live in the memory of the copy that created them. The session id ends with ".a" or
  # ".b" (Tomcat jvmRoute), so a signed-in tab always goes back to its own copy. If that copy is
  # down, the request goes to the other copy, which asks the user to sign in again.
  map $http_x_session_id $backend_pool {
    "~\.a$"  copy_a_first;
    "~\.b$"  copy_b_first;
    default  both_copies;
  }

  # Docker's DNS, IPv4 only: host.docker.internal also has an IPv6 address where the copies do
  # not answer, and a failed IPv6 try would send a signed-in user to the wrong copy.
  resolver 127.0.0.11 ipv6=off valid=30s;

  # Passive health check: after one failed connection a copy is skipped for 10 seconds.
  upstream both_copies {
    zone both_copies 64k;
    server host.docker.internal:8081 resolve max_fails=1 fail_timeout=10s;
    server host.docker.internal:8082 resolve max_fails=1 fail_timeout=10s;
  }
  upstream copy_a_first {
    zone copy_a_first 64k;
    server host.docker.internal:8081 resolve max_fails=1 fail_timeout=10s;
    server host.docker.internal:8082 resolve backup;
  }
  upstream copy_b_first {
    zone copy_b_first 64k;
    server host.docker.internal:8082 resolve max_fails=1 fail_timeout=10s;
    server host.docker.internal:8081 resolve backup;
  }

  server {
    listen 80;
    client_max_body_size 10m;

    location / {
      proxy_pass http://$backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      proxy_read_timeout 60s;
      # Only a copy that does not answer counts as down. The API itself returns 502 when there is
      # no live price, and that answer must reach the user. Nginx never resends a POST that already
      # reached a copy, so an order cannot be placed twice.
      proxy_next_upstream error timeout;
      proxy_next_upstream_tries 2;
      # Shows which copy answered (for the demo and for debugging).
      add_header X-Upstream $upstream_addr always;
    }
  }
}
