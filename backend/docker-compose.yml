services:
  db:
    image: postgres:16-alpine
    container_name: broker_ui_db
    environment:
      POSTGRES_DB: broker_ui
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - broker_ui_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broker -d broker_ui"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Load balancer for two backend copies on 8081 and 8082. Starts only with:
  #   docker compose --profile lb up -d
  lb:
    image: nginx:alpine
    container_name: broker_ui_lb
    profiles: ["lb"]
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  broker_ui_pgdata:
