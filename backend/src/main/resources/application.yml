server:
  port: 8080

spring:
  application:
    name: broker-ui-backend
  profiles:
    active: postgres
  datasource:
    url: jdbc:h2:mem:broker_ui;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    ignore-missing-migrations: true
    validate-on-migrate: false

broker:
  # Real netting (client vs client / client vs computer) — see buysellmodel/NETTING_IMPLEMENTATION_PLAN.md
  netting:
    external-fee-rate: 0.001      # 0.10% of notional on the quantity routed to the external market
    nn-shadow: true                # NN advisor is called after commit and only recorded, never decides
    limit-wait-ms: 5000            # a close or a marketable LIMIT waits this long for an internal counterparty (0 = never)
    test-endpoints:
      enabled: true                # demo only: /api/admin/netting/test/** (localhost-only anyway)
      freeze-ttl-minutes: 10       # frozen test prices expire on their own
    sim:                           # "the computer": simulated clients that quote and trade
      enabled: true
      symbols: BTCUSD,EURUSD,XAUUSD
      tick-ms: 3000
      orders-per-side: 3
      quote-offset-min-bps: -2
      quote-offset-max-bps: 2
      ttl-seconds: 30
      market-rate-per-min: 6
      position-ttl-minutes: 10
  market:
    finnhub-api-key: ${FINNHUB_API_KEY:}
    rapidapi-key: ${RAPIDAPI_KEY:}
  mt5:
    auto-connect: ${MT5_AUTO_CONNECT:false}
    base-path: ${MT5_BASE_PATH:}

logging:
  level:
    org.hibernate.SQL: warn
